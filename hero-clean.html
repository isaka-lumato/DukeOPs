<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DukeOps — Editorial Cover Hero</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <section id="hero-section" class="hero-cover">
    <div class="hero-cover__media" aria-hidden="true">
      <img
        src="assets/images/hero-editorial.jpg"
        alt="Modern commercial concrete and warm stone architecture in Dar es Salaam at golden hour"
        width="1600"
        height="900"
      />
    </div>
    <div class="container">
      <div class="hero-cover__content">
        <h1 id="hero-title" class="hero-cover__title">
          Built safely.<br />Delivered reliably.
        </h1>
        <p id="hero-subtitle" class="hero-cover__lead">
          Construction, utility engineering, HSE compliance, and hardware supply for commercial and residential projects across Tanzania.
        </p>
        <div class="hero-cover__actions">
          <a href="contact.html" id="hero-cta-button" class="btn btn-gold">
            Request a Quote
          </a>
          <a href="services.html" id="hero-secondary-cta" class="hero-cover__link">
            Explore services <i class="bi bi-arrow-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
